services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # All optional. Leave OPENAI_API_KEY empty to run fully offline.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      GENERATOR: "${GENERATOR:-local}"
      POSTER_LONG_EDGE: "${POSTER_LONG_EDGE:-1536}"
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
