<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Fire — bend thumb to fire</title>
<link rel="stylesheet" href="camera-fire.css">
</head>
<body>
  <div class="crt">
    <div class="crt-frame">
      <div class="topbar">
        <div class="url">
          <span class="proto">://</span>
          <span class="title" id="title">Camera Fire — bend thumb to fire</span>
          <span class="caret">_</span>
        </div>
        <div class="controls">
          <label class="ctl"><input type="checkbox" id="funToggle" checked> fun?</label>
          <label class="ctl">
            <input type="range" id="sensitivity" min="0" max="100" value="55">
            <span id="sensVal">55%</span>
          </label>
          <span class="hint">[ bend thumb to fire ]</span>
        </div>
      </div>

      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div id="permission" class="overlay">
          <div class="panel">
            <h1>CAMERA FIRE</h1>
            <p>Make a finger gun at your camera. Bend your thumb to fire.</p>
            <p class="small">Requires webcam permission. Runs entirely in your browser.</p>
            <button id="startBtn">START CAMERA</button>
            <p class="small err" id="errMsg"></p>
          </div>
        </div>
        <div id="hud" class="hud hidden">
          <div class="muteIcon" id="muteIcon">◔</div>
        </div>
      </div>

      <div class="bottombar">
        <div class="stat"><span class="lbl">READY</span></div>
        <div class="sep">|</div>
        <div class="stat"><span class="lbl">HAND:</span><span id="handStat">--</span></div>
        <div class="sep">|</div>
        <div class="stat"><span class="lbl">THUMB:</span><span id="thumbStat">--</span></div>
        <div class="sep">|</div>
        <div class="stat"><span class="lbl">SHOTS:</span><span id="shotsStat">0</span></div>
        <div class="sep">|</div>
        <div class="stat"><span class="lbl">HITS:</span><span id="hitsStat">0</span></div>
        <div class="sep">|</div>
        <div class="stat"><span class="lbl">SCORE:</span><span id="scoreStat">0</span></div>
      </div>
    </div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="camera-fire.js"></script>
</body>
</html>
